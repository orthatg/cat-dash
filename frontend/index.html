<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Dash</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="viz-root">
      <header class="masthead">
        <div class="mast-rail">
          <span id="today" class="mono">—</span>
          <span id="live" class="live mono" data-state="connecting" role="status">
            <span class="live-dot" aria-hidden="true"></span><span class="live-text">Connecting</span>
          </span>
        </div>
        <h1>Cat Dash</h1>
        <div class="mast-foot">
          <p class="standfirst">The litter box, the food, and the cats who use them.</p>
          <div class="range mono" role="radiogroup" aria-label="History range for all charts">
            <span class="range-label" aria-hidden="true">Range</span>
            <button type="button" role="radio" data-days="7" aria-checked="false">7d</button>
            <button type="button" role="radio" data-days="30" aria-checked="true">30d</button>
            <button type="button" role="radio" data-days="90" aria-checked="false">90d</button>
          </div>
        </div>
      </header>

      <div id="errors" class="errors" hidden></div>

      <main>
        <section class="domain domain-litter" aria-labelledby="litter-heading">
          <header class="section-head">
            <span class="section-no mono" aria-hidden="true">01</span>
            <h2 id="litter-heading">Litter box</h2>
            <p class="section-dek">Drawer, cleaning, and who's been using it.</p>
          </header>
          <div id="litter-cards" class="cards"><p class="muted mono">Loading…</p></div>
          <div id="litter-charts" class="charts"></div>
        </section>

        <section class="domain domain-food" aria-labelledby="food-heading">
          <header class="section-head">
            <span class="section-no mono" aria-hidden="true">02</span>
            <h2 id="food-heading">Food</h2>
            <p class="section-dek">Meals dispensed and time spent eating, by cat.</p>
          </header>
          <div id="food-cards" class="cards"><p class="muted mono">Loading…</p></div>
          <div id="food-charts" class="charts"></div>
        </section>
      </main>

      <footer class="colophon mono">Cat Dash · Litter-Robot 4 &amp; Petlibro · data refreshes live</footer>

      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </div>
  </body>
</html>
