<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Dash</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="viz-root">
      <header class="topbar">
        <h1>Cat Dash</h1>
        <span id="live" class="live" data-state="connecting" role="status">
          <span class="live-dot" aria-hidden="true"></span><span class="live-text">Connecting…</span>
        </span>
      </header>

      <div id="errors" class="errors" hidden></div>

      <main>
        <section aria-labelledby="now-heading">
          <h2 id="now-heading" class="section-title">Right now</h2>
          <div id="cards" class="cards">
            <p class="muted">Loading devices…</p>
          </div>
        </section>

        <section aria-labelledby="history-heading" class="history">
          <div class="history-head">
            <h2 id="history-heading" class="section-title">History</h2>
            <div class="range" role="radiogroup" aria-label="Date range">
              <button type="button" role="radio" data-days="7" aria-checked="false">7 days</button>
              <button type="button" role="radio" data-days="30" aria-checked="true">30 days</button>
              <button type="button" role="radio" data-days="90" aria-checked="false">90 days</button>
            </div>
          </div>
          <div id="charts" class="charts"></div>
        </section>
      </main>

      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </div>
  </body>
</html>
