<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Dash</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="viz-root">
      <header class="bar">
        <h1>Cat Dash</h1>
        <span id="today" class="today">—</span>
        <span id="live" class="live" data-state="connecting" role="status">
          <span class="live-dot" aria-hidden="true"></span><span class="live-text">Connecting</span>
        </span>
        <div class="perch" aria-hidden="true">
          <img class="perch-zora" src="assets/cats/zora-cutout.png" alt="" onerror="this.remove()" />
          <img class="perch-maui" src="assets/cats/maui-cutout.png" alt="" onerror="this.remove()" />
        </div>
      </header>

      <section id="attention" class="attention" data-level="ok" aria-label="What needs you" aria-live="polite">
        <div class="att-calm"><p class="att-calm-text">Checking the devices…</p></div>
      </section>

      <div id="errors" class="errors" hidden></div>

      <main>
        <section aria-label="Litter box">
          <div id="litter-tiles" class="litter-grid"><p class="muted">Loading…</p></div>
        </section>

        <section aria-label="Feeders">
          <div id="food-tiles"><p class="muted">Loading…</p></div>
        </section>

        <section aria-label="Robot vacuum">
          <div id="roomba-tiles"></div>
        </section>

        <details id="more" class="more">
          <summary>
            <span class="more-label">History</span>
            <span id="more-summary" class="chips"></span>
            <span class="range" role="radiogroup" aria-label="History range">
              <button type="button" role="radio" data-days="7" aria-checked="false">7d</button>
              <button type="button" role="radio" data-days="30" aria-checked="true">30d</button>
              <button type="button" role="radio" data-days="90" aria-checked="false">90d</button>
            </span>
          </summary>
          <div id="insight-tiles" class="insight-grid"></div>
          <div id="more-charts" class="charts"></div>
        </details>
      </main>

      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </div>
  </body>
</html>
