<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Dash</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="viz-root">
      <header class="bar">
        <h1>Cat Dash</h1>
        <span id="today" class="today">—</span>
        <span id="live" class="live" data-state="connecting" role="status">
          <span class="live-dot" aria-hidden="true"></span><span class="live-text">Connecting</span>
        </span>
      </header>

      <div id="errors" class="errors" hidden></div>

      <main>
        <section class="row" aria-label="Litter box now">
          <div id="litter-tiles" class="tiles tiles-litter"><p class="muted">Loading…</p></div>
        </section>

        <section class="row" aria-label="Food now">
          <div id="food-tiles" class="tiles tiles-food"><p class="muted">Loading…</p></div>
        </section>

        <section class="row" aria-label="Patterns">
          <div id="insight-tiles" class="tiles tiles-insight"></div>
        </section>

        <details id="more" class="more">
          <summary>
            <span class="more-label">More</span>
            <span id="more-summary" class="chips"></span>
            <span class="range" role="radiogroup" aria-label="History range">
              <button type="button" role="radio" data-days="7" aria-checked="false">7d</button>
              <button type="button" role="radio" data-days="30" aria-checked="true">30d</button>
              <button type="button" role="radio" data-days="90" aria-checked="false">90d</button>
            </span>
          </summary>
          <div id="more-charts" class="charts"></div>
        </details>
      </main>

      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </div>
  </body>
</html>
